[package]
name = "kylin-stock"
version = "0.1.15"
description = "KylinStock material inventory management desktop application"
authors = ["devotionn"]
edition = "2021"

[lib]
name = "kylin_stock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = ["dialog-open", "dialog-save", "fs-write-file", "path-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
fs2 = "0.4"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
