<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>物资管理系统</title>
    <style>
      #startup-screen { position:fixed; inset:0; z-index:99999; display:flex; align-items:center; justify-content:center; background:linear-gradient(145deg,#eaf7ff 0%,#f5fbff 48%,#ecfff5 100%); color:#155eef; font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; transition:opacity .28s ease,visibility .28s ease; }
      #startup-screen.startup-done { opacity:0; visibility:hidden; }
      .startup-card { display:flex; flex-direction:column; align-items:center; gap:16px; }
      .startup-icon { width:112px; height:112px; border-radius:25px; box-shadow:0 18px 50px rgba(21,94,239,.18); animation:startup-float 1.8s ease-in-out infinite; }
      .startup-title { font-size:26px; font-weight:700; letter-spacing:4px; }
      .startup-dots { display:flex; gap:8px; }
      .startup-dots i { width:9px; height:9px; border-radius:50%; background:#409eff; animation:startup-pulse 1.1s ease-in-out infinite; }
      .startup-dots i:nth-child(2) { animation-delay:.16s; }
      .startup-dots i:nth-child(3) { animation-delay:.32s; }
      @keyframes startup-float { 50% { transform:translateY(-7px); } }
      @keyframes startup-pulse { 0%,100% { opacity:.28; transform:scale(.8); } 50% { opacity:1; transform:scale(1.15); } }
    </style>
  </head>
  <body>
    <div id="startup-screen" role="status" aria-label="物资管理系统正在启动">
      <div class="startup-card">
        <img class="startup-icon" src="/src/assets/app-icon.png" alt="" />
        <div class="startup-title">物资管理系统</div>
        <div class="startup-dots"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
