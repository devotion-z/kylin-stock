name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript and Vite build
        run: npm run build

      - name: Frontend unit tests
        run: npm test

      - name: Rust compile check with locked dependencies
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  arm64-package-smoke:
    runs-on: ubuntu-22.04-arm
    container: ubuntu:20.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm native architecture
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"

      - name: Bootstrap Ubuntu 20.04 container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            dbus-x11

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify locked Rust dependency graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps > /dev/null

      - name: Build native ARM64 deb smoke package
        run: ./scripts/build-deb.sh

      - name: Verify Debian package metadata
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          ls -lah "$DEB"
          dpkg-deb --info "$DEB"

          PACKAGE="$(dpkg-deb --field "$DEB" Package)"
          VERSION="$(dpkg-deb --field "$DEB" Version)"
          ARCH="$(dpkg-deb --field "$DEB" Architecture)"
          DEPENDS="$(dpkg-deb --field "$DEB" Depends)"

          printf 'Package=%s\nVersion=%s\nArchitecture=%s\nDepends=%s\n' \
            "$PACKAGE" "$VERSION" "$ARCH" "$DEPENDS"

          test "$PACKAGE" = "kylin-stock"
          test "$VERSION" = "0.1.9"
          test "$ARCH" = "arm64"
          printf '%s\n' "$DEPENDS" | grep -F 'libwebkit2gtk-4.0-37'
          if printf '%s\n' "$DEPENDS" | grep -F 'libwebkit2gtk-4.1-0'; then
            echo 'Kylin-incompatible WebKitGTK 4.1 dependency detected' >&2
            exit 1
          fi

      - name: Install generated ARM64 deb
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          install -d /home/icon-smoke/Desktop
          dpkg -i "$DEB"

          STATUS="$(dpkg-query -W -f='${db:Status-Status}' kylin-stock)"
          VERSION="$(dpkg-query -W -f='${Version}' kylin-stock)"
          ARCH="$(dpkg-query -W -f='${Architecture}' kylin-stock)"
          printf 'Installed status=%s version=%s arch=%s\n' "$STATUS" "$VERSION" "$ARCH"
          test "$STATUS" = "installed"
          test "$ARCH" = "arm64"
          SHORTCUT="/home/icon-smoke/Desktop/物资管理系统.desktop"
          test -x "$SHORTCUT"
          grep -Fx 'Name=物资管理系统' "$SHORTCUT"
          SHORTCUT_ICON="$(sed -n 's/^Icon=//p' "$SHORTCUT" | head -n 1)"
          test -f "$SHORTCUT_ICON"

      - name: Verify installed executable and desktop entry
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(command -v kylin-stock)"
          test -x "$BIN"
          file "$BIN"

          if ldd "$BIN" | grep -F 'not found'; then
            echo 'Missing shared library detected' >&2
            exit 1
          fi

          DESKTOP="$(find /usr/share/applications -maxdepth 1 -type f -iname '*kylin*stock*.desktop' -print -quit)"
          test -n "$DESKTOP"
          printf 'Desktop entry: %s\n' "$DESKTOP"
          cat "$DESKTOP"
          grep -Fx 'Name=物资管理系统' "$DESKTOP"
          grep -Eq '^Exec=.*kylin-stock' "$DESKTOP"
          ICON_VALUE="$(sed -n 's/^Icon=//p' "$DESKTOP" | head -n 1)"
          test -n "$ICON_VALUE"
          if [[ "$ICON_VALUE" = /* ]]; then
            test -f "$ICON_VALUE"
            ICON_FILE="$ICON_VALUE"
          else
            ICON_FILE="$(find /usr/share/icons /usr/share/pixmaps -type f \
              \( -name "$ICON_VALUE.png" -o -name "$ICON_VALUE.svg" -o -name "$ICON_VALUE.xpm" \) \
              -print -quit 2>/dev/null)"
            test -n "$ICON_FILE"
          fi
          printf 'Desktop icon: %s\n' "$ICON_FILE"
          file "$ICON_FILE"

      - name: Smoke launch installed application
        shell: bash
        run: |
          set +e
          xvfb-run -a timeout 10s kylin-stock
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ]; then
            echo "Application exited unexpectedly with status $STATUS" >&2
            exit 1
          fi

      - name: Upload ARM64 smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: kylin-stock-arm64-kylin-v10-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
